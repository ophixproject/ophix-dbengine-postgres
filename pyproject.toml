[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-dbengine-postgres"
version = "2026.06.01.01"
description = "PostgreSQL database driver plugin for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
keywords = ["django", "ophix", "postgresql", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "ophix-server-base>=2026.05.26.01",
    "psycopg2-binary>=2.9",
]

[project.urls]
Homepage = "https://ophix.io"
Documentation = "https://github.com/ophixproject/ophix-dbengine-postgres#readme"
Source = "https://github.com/ophixproject/ophix-dbengine-postgres"

[project.entry-points."ophix.plugins"]
ophix_dbengine_postgres = "ophix_dbengine_postgres"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophix_dbengine_postgres" = [
    "OPHIX_RELEASE_NOTES.md",
    "deploy_templates/**/*",
]
